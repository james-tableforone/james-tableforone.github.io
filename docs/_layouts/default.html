<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

{% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    <!--[if lt IE 9]>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv.min.js"></script>
    <![endif]-->
    {% include head-custom.html %}
  </head>
  <body>
    <div class="gridLayout">
		<div class="navBar">
		  <header>
			{% if site.logo %}
			  <a href="{{ "/" | absolute_url }}"><img src="{{site.logo | relative_url}}" alt="Logo" class="Logo" /></a>
			{% endif %}

			<p class="Header-text">{{ site.description | default: site.github.project_tagline }}</p>

			<ul>
			  {% for post in site.posts limit:3 %}
				<li>
				  <a class="postLink" href="{{ post.url | relative_url }}">{{ post.title }}</a>
				  <span>{{ post.date | date: "%B %d, %Y" }}</span>
				</li>
			  {% endfor %}
			</ul>
		  </header>
		 </div>
      <section class="Content">

      {{ content }}

      </section>
	  <div class="Footer">
			<p class="footerLink"> <a href="{{ "/about/ " | absolute_url }}"> About </a></p> 
			<p class="footerLink"><a href="{{ "/Index/ " | absolute_url }}"> Post Index </a></p>
	  </div>
    <script src="{{ "/assets/js/scale.fix.js" | relative_url }}"></script>
  </body>
</html>
